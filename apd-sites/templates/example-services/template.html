<main class="page">
  <section class="price-list">
    <h2>Services &amp; prices</h2>
    <ul class="price-items">
      {{#each services}}<li class="price-item"><span class="price-title">{{title}}</span><span class="price-amount">{{price}}</span></li>{{/each}}
    </ul>
  </section>

  <section class="intro">
    <h1>{{name}}</h1>
    <p>{{description}}</p>
  </section>

  <section class="details">
    <h2>Where we work</h2>
    <p>{{service_area}}</p>
    <p>{{suburb}}</p>
  </section>

  <section class="contact">
    <h2>Book a job</h2>
    <p>Phone: <a href="tel:{{phone}}">{{phone}}</a></p>
    <p>Email: <a href="mailto:{{email}}">{{email}}</a></p>
    <p>Hours: {{hours}}</p>
  </section>
</main>
